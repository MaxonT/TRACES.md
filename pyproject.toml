[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "traces-md"
version = "0.1.0"
description = "TRACES.md: an open standard for how AI agents record what they did, for error analysis and self-optimization. Reference CLI `traces`."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MaxonT" }]
keywords = ["ai-agents", "traces", "error-analysis", "agents-md", "observability", "standard"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://maxont.github.io/traces-md"
Source = "https://github.com/MaxonT/traces-md"
Spec = "https://github.com/MaxonT/traces-md/blob/main/SPEC.md"

[project.scripts]
traces = "traces.cli:main"

[tool.setuptools]
packages = ["traces"]

[tool.setuptools.package-data]
traces = ["trace.schema.json"]
